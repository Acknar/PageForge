# Flatpak manifest for PageForge (GTK4 + Libadwaita), on the GNOME runtime.
#
# Build and install locally:   sh build.sh
# CI builds a .flatpak bundle per architecture (.github/workflows/build-installers.yml).
#
# Not a Flathub manifest: the Python wheels and the Tesseract language data are
# downloaded during the build (build-args --share=network), which Flathub does
# not allow.
app-id: io.local.PageForge
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: pageforge

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Tools install their extra Python packages (rembg, EasyOCR, ...) on demand.
  - --share=network
  # Files are opened from anywhere and results are written beside them.
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'

modules:
  # Base Python dependencies, plus pip itself so tools can install theirs.
  - name: python-deps
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - >-
        pip3 install --no-cache-dir --only-binary=:all: --prefix=${FLATPAK_DEST}
        pip pymupdf pillow numpy pytesseract

  # Tesseract, for the OCR (zones) tool. The RPM and source installs get it
  # from dnf; inside the sandbox it has to be bundled.
  - name: leptonica
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=ON
      - -DSW_BUILD=OFF
      - -DBUILD_PROG=OFF
    sources:
      - type: git
        url: https://github.com/DanBloomberg/leptonica.git
        tag: 1.85.0

  - name: tesseract
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DCMAKE_PREFIX_PATH=/app
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TRAINING_TOOLS=OFF
      - -DBUILD_TESTS=OFF
      - -DGRAPHICS_DISABLED=ON
      - -DDISABLE_CURL=ON
      - -DDISABLE_ARCHIVE=ON
      - -DOPENMP_BUILD=OFF
      - -DSW_BUILD=OFF
    sources:
      - type: git
        url: https://github.com/tesseract-ocr/tesseract.git
        tag: 5.5.1

  - name: tessdata
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/share/tessdata
      - >-
        for lang in eng fra osd; do
        python3 -c 'import sys, urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])'
        "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata"
        "${FLATPAK_DEST}/share/tessdata/$lang.traineddata";
        done

  - name: pageforge
    buildsystem: simple
    sources:
      - type: dir
        path: ..
        skip:
          - flatpak/build-dir
          - flatpak/repo
          - flatpak/.flatpak-builder
    build-commands:
      - install -Dm644 pageforge.py ${FLATPAK_DEST}/share/pageforge/pageforge.py
      - cp -r tools icons ${FLATPAK_DEST}/share/pageforge/
      - python3 -m compileall -q ${FLATPAK_DEST}/share/pageforge
      - install -Dm755 flatpak/pageforge.sh ${FLATPAK_DEST}/bin/pageforge
      - install -Dm644 io.local.PageForge.desktop ${FLATPAK_DEST}/share/applications/io.local.PageForge.desktop
      - >-
        sed -i -e '/^# Edit Exec/d' -e 's|^Exec=.*|Exec=pageforge|'
        ${FLATPAK_DEST}/share/applications/io.local.PageForge.desktop
      - install -Dm644 io.local.PageForge.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.local.PageForge.svg
      - install -Dm644 io.local.PageForge.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.local.PageForge.metainfo.xml
